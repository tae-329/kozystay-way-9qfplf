const SIZE = (f) => f[0] === "h" ? [960, 480] : (f === "w20" ? [960, 850] : [960, 720]);
const $ = (s) => document.querySelector(s);

function detectLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  try { const s = localStorage.getItem("ks-lang"); if (s && T[s]) return s; } catch (e) {}
  const n = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  if (n.startsWith("zh")) return "zh";
  if (n.startsWith("ja")) return "ja";
  if (n.startsWith("ko")) return "ko";
  return "en";
}

let lang = detectLang();
let route = location.hash === "#haengdang" ? "h" : "w";
const t = (k) => (T[lang] && T[lang][k]) || T.en[k] || "";

function renderSteps() {
  document.querySelectorAll(".route").forEach((b) => {
    const on = b.dataset.route === route;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  $("#svnote").hidden = route !== "h";
  const ol = $("#steps");
  ol.textContent = "";
  ROUTES[route].forEach((s) => {
    const li = document.createElement("li");
    li.className = "step";
    const head = document.createElement("div");
    head.className = "step-h";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = s.n;
    const txt = document.createElement("div");
    const cap = document.createElement("p");
    cap.className = "cap";
    cap.textContent = s.t[lang] || s.t.en;
    txt.appendChild(cap);
    if (s.other) {
      const o = document.createElement("p");
      o.className = "other";
      o.textContent = t("otherDir");
      txt.appendChild(o);
    }
    if (s.note) {
      const o = document.createElement("p");
      o.className = "other";
      o.textContent = s.note[lang] || s.note.en;
      txt.appendChild(o);
    }
    head.append(badge, txt);
    li.appendChild(head);
    s.img.forEach(([f, no]) => {
      const a = document.createElement("a");
      a.className = "ph";
      a.href = "img/" + f + ".jpg";
      a.target = "_blank";
      a.rel = "noopener";
      const im = document.createElement("img");
      const [iw, ih] = SIZE(f);
      im.width = iw; im.height = ih;
      im.loading = "lazy"; im.decoding = "async";
      im.alt = t("stepAlt").replace("{n}", no);
      im.src = "img/" + f + ".jpg";
      a.appendChild(im);
      if (s.img.length > 1) {
        const k = document.createElement("span");
        k.className = "pn";
        k.textContent = no;
        a.appendChild(k);
      }
      li.appendChild(a);
    });
    ol.appendChild(li);
  });
}

function applyLang() {
  document.documentElement.lang = HTML_LANG[lang];
  document.title = t("docTitle");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  renderSteps();
}

document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("ks-lang", lang); } catch (e) {}
  applyLang();
}));

function setRoute(r) {
  route = r;
  try { history.replaceState(null, "", location.pathname + location.search + (r === "h" ? "#haengdang" : "#wangsimni")); } catch (e) {}
  renderSteps();
}
document.querySelectorAll(".route").forEach((b) => b.addEventListener("click", () => setRoute(b.dataset.route)));
$("#switch").addEventListener("click", () => {
  setRoute(route === "w" ? "h" : "w");
  $("#choose").scrollIntoView({ behavior: "smooth", block: "start" });
});
window.addEventListener("hashchange", () => setRoute(location.hash === "#haengdang" ? "h" : "w"));

$("#copy").addEventListener("click", async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(ADDR_KO); ok = true; } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = ADDR_KO; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  const span = $("#copy span");
  span.textContent = ok ? t("copied") : t("copy");
  if (ok) setTimeout(() => { span.textContent = t("copy"); }, 1800);
});

applyLang();
</script>
